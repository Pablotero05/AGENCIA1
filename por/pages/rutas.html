  <script>if(!/[?&]exp=(adventure|premium)(&|$)/.test(location.search))document.documentElement.classList.add('exp-select-mode');</script>
  <style data-exp-v2-css>
    html.exp-select-mode body section:not(#experience-selector),
    html.exp-select-mode sts-footer{display:none!important}
    #experience-selector{position:relative;display:flex;flex-direction:column;width:100%;
      height:calc(100vh - 6rem);height:calc(100svh - 6rem);min-height:30rem;background:#0b0b0b;overflow:hidden}
    .exp-pill{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
      padding:.4rem 1rem;border-radius:999px;background:rgba(255,255,255,.92);color:#111;font-size:.7rem;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
    .exp-panel{position:relative;flex:1 1 0;min-height:0;width:100%;display:block;padding:0;border:0;margin:0;overflow:hidden;
      cursor:pointer;text-align:left;color:#fff;background:#111;-webkit-tap-highlight-color:transparent;
      transition:flex-grow .7s cubic-bezier(.22,1,.36,1)}
    .exp-panel+.exp-panel{border-top:2px solid rgba(255,255,255,.85)}
    .exp-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      transition:transform 1.2s cubic-bezier(.22,1,.36,1),filter .6s ease}
    .exp-overlay{position:absolute;inset:0}
    .exp-adventure .exp-overlay{background:linear-gradient(to top,rgba(8,50,28,.92) 5%,rgba(0,0,0,.2) 75%)}
    .exp-premium .exp-overlay{background:linear-gradient(to top,rgba(66,42,8,.92) 5%,rgba(0,0,0,.2) 75%)}
    .exp-content{position:absolute;left:0;right:0;bottom:0;display:block;padding:1rem 1.25rem 1.25rem;
      animation:expRise .8s cubic-bezier(.22,1,.36,1) both}
    .exp-tag{display:inline-block;margin-bottom:.4rem;padding:.25rem .7rem;border-radius:999px;background:rgba(255,255,255,.18);
      backdrop-filter:blur(4px);font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .exp-title{display:block;margin-bottom:.35rem;font-size:clamp(1.75rem,8vw,2.5rem);font-weight:700;line-height:1.05;
      font-family:var(--font-family-heading)}
    .exp-text{display:block;max-width:28rem;margin-bottom:.7rem;font-size:.9rem;line-height:1.4;color:#e5e7eb}
    .exp-list{display:none;list-style:none;margin:0 0 1rem;padding:0}
    .exp-list li{margin-bottom:.3rem;font-size:.95rem}
    .exp-list i{margin-right:.4rem;color:#fbbf24}
    .exp-cta{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.2rem;border-radius:.6rem;background:#fff;color:#111;
      font-size:.9rem;font-weight:700;transition:gap .3s ease}
    .exp-panel:active{filter:brightness(.92)}
    @media(min-width:480px) and (min-height:640px){.exp-text{font-size:1rem}.exp-list{display:block}}
    @media(min-width:768px){
      #experience-selector{flex-direction:row;min-height:34rem}
      .exp-pill{top:1.5rem;font-size:.8rem;padding:.5rem 1.4rem}
      .exp-panel+.exp-panel{border-top:0;border-left:2px solid rgba(255,255,255,.85)}
      .exp-content{padding:2.5rem 2.5rem 3rem}
      .exp-title{font-size:clamp(2.5rem,5vw,4.5rem)}
      .exp-text{font-size:1.05rem}
      .exp-list{display:block}
    }
    @media(min-width:768px) and (hover:hover){
      .exp-text,.exp-list,.exp-cta{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
      .exp-panel:hover .exp-text,.exp-panel:focus-visible .exp-text,
      .exp-panel:hover .exp-list,.exp-panel:focus-visible .exp-list,
      .exp-panel:hover .exp-cta,.exp-panel:focus-visible .exp-cta{opacity:1;transform:none}
      #experience-selector:hover .exp-panel{flex-grow:.7}
      #experience-selector .exp-panel:hover,#experience-selector .exp-panel:focus-visible{flex-grow:1.6}
      .exp-panel:hover img,.exp-panel:focus-visible img{transform:scale(1.08)}
      #experience-selector:hover .exp-panel:not(:hover) img{filter:grayscale(.6) brightness(.7)}
      .exp-panel:hover .exp-cta{gap:1rem}
    }
    @keyframes expRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.exp-panel,.exp-panel img,.exp-content,.exp-text,.exp-list,.exp-cta{transition:none!important;animation:none!important}}
  </style>

<body class="h-full bg-white">
  <div class="frame-root">
    <div class="frame-content">
      <div class="[font-family:var(--font-family-body)]">
        <sts-header></sts-header>

        <!-- ===== HERO ===== -->
        <section class="relative py-24 overflow-hidden">
          <div class="absolute inset-0 z-0">
            <img src="/assets/rutas_banner.webp" alt="Catedral de Santiago de Compostela" class="w-full h-full object-cover" fetchpriority="high" decoding="async" width="1920" height="600">
            <div class="absolute inset-0 bg-gradient-to-r from-black/75 via-black/55 to-transparent"></div>
          </div>
          <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-2xl">
              <p class="text-[var(--accent-color)] font-semibold text-lg mb-3 tracking-wider uppercase"><span data-route-count>8</span> rotas jacobeias</p>
              <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white mb-5 leading-tight" style="font-family: var(--font-family-heading);">
                Todas as Rotas do Caminho de Santiago
              </h1>
              <p class="text-gray-200 text-xl mb-8 leading-relaxed">Do Caminho Francês clássico até os caminhos mais remotos e autênticos. Encontre a rota que melhor se adapta a você.</p>
              <nav class="flex gap-2 text-sm text-gray-400">
                <a href="/por/index.html" class="hover:text-white transition-colors">Início</a>
                <span>/</span>
                <span class="text-white">Rotas</span>
              </nav>
            </div>
          </div>
        </section>

        <!-- ===== SELECTOR DE EXPERIENCIA (v2) ===== -->
  <section id="experience-selector" data-exp-v2 aria-label="Escolha a sua experiência">
    <span class="exp-pill">Escolha a sua experiência</span>
    <button type="button" class="exp-panel exp-adventure" onclick="stsSelectExperience('adventure')" aria-label="Adventure">
      <img src="/assets/adventure.png" alt="" loading="eager" decoding="async">
      <span class="exp-overlay"></span>
      <span class="exp-content">
        <span class="exp-tag">Caminho autêntico</span>
        <span class="exp-title">Adventure</span>
        <span class="exp-text">Natureza, espírito de peregrino e alojamentos com charme a um preço justo.</span>
        <ul class="exp-list"><li><i class="fa-solid fa-check" aria-hidden="true"></i>Alojamentos com charme</li><li><i class="fa-solid fa-check" aria-hidden="true"></i>Transporte de mochilas</li><li><i class="fa-solid fa-check" aria-hidden="true"></i>Melhor relação qualidade-preço</li></ul>
        <span class="exp-cta">Ver rotas <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </span>
    </button>
    <button type="button" class="exp-panel exp-premium" onclick="stsSelectExperience('premium')" aria-label="Premium">
      <img src="/assets/premium.png" alt="" loading="lazy" decoding="async">
      <span class="exp-overlay"></span>
      <span class="exp-content">
        <span class="exp-tag">Máximo conforto</span>
        <span class="exp-title">Premium</span>
        <span class="exp-text">Hotéis selecionados, mais conforto e atendimento personalizado em cada etapa.</span>
        <ul class="exp-list"><li><i class="fa-solid fa-check" aria-hidden="true"></i>Hotéis selecionados</li><li><i class="fa-solid fa-check" aria-hidden="true"></i>Transporte de mochilas</li><li><i class="fa-solid fa-check" aria-hidden="true"></i>Atendimento personalizado</li></ul>
        <span class="exp-cta">Ver rotas <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span>
      </span>
    </button>
  </section>
  <div id="routes-list-wrapper" style="display:none">
    <div class="bg-white border-b border-[var(--light-border-color)]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-3">
        <span class="text-[var(--gray-text-color)] text-sm">Experiência: <strong class="text-[var(--dark-text-color)]" data-exp-label></strong></span>
        <button type="button" onclick="stsResetExperience()" class="px-4 py-2 rounded-full text-sm font-semibold bg-gray-100 hover:bg-gray-200 transition-all"><i class="fa-solid fa-arrow-left"></i> Mudar experiência</button>
      </div>
    </div>
    <!-- ===== FILTRO VISUAL ===== -->
        <section class="py-8 bg-white border-b border-[var(--light-border-color)] top-24 z-40 shadow-sm">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap gap-3 items-center">
              <span class="text-[var(--gray-text-color)] font-medium text-sm mr-2">Filtrar por dificuldade:</span>
              <button onclick="filterRoutes('all')" class="filter-btn active px-5 py-2 rounded-full text-sm font-semibold bg-[var(--primary-color)] text-white transition-all" data-filter="all">Todas</button>
              <button onclick="filterRoutes('facil')" class="filter-btn px-5 py-2 rounded-full text-sm font-semibold bg-gray-100 text-[var(--gray-text-color)] hover:bg-green-100 hover:text-green-700 transition-all" data-filter="facil">Fácil</button>
              <button onclick="filterRoutes('moderado')" class="filter-btn px-5 py-2 rounded-full text-sm font-semibold bg-gray-100 text-[var(--gray-text-color)] hover:bg-yellow-100 hover:text-yellow-700 transition-all" data-filter="moderado">Moderado</button>
              <button onclick="filterRoutes('exigente')" class="filter-btn px-5 py-2 rounded-full text-sm font-semibold bg-gray-100 text-[var(--gray-text-color)] hover:bg-orange-100 hover:text-orange-700 transition-all" data-filter="exigente">Exigente</button>
              <button onclick="filterRoutes('muy-exigente')" class="filter-btn px-5 py-2 rounded-full text-sm font-semibold bg-gray-100 text-[var(--gray-text-color)] hover:bg-red-100 hover:text-red-700 transition-all" data-filter="muy-exigente">Muito Exigente</button>
            </div>
          </div>
        </section>

        <!-- ===== GRID DE RUTAS ===== -->
        <section class="py-20 bg-[var(--light-background-color)]">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="routes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
              <!-- As cards são geradas automaticamente pelo routeCards.js -->
            </div>
          </div>
        </section>
  </div>

        <sts-footer></sts-footer>
      </div>
    </div>
  </div>
</body>
